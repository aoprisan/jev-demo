[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "jev-desk over HTTP: the same runs, the same judgments, as a typed JSON API."

[[bin]]
name = "jev-desk-server"
path = "src/main.rs"

[dependencies]
battery.workspace = true
fx.workspace = true
jev-core.workspace = true
report.workspace = true
synth.workspace = true

anyhow.workspace = true
axum.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
